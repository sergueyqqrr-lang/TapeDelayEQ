name: Build Windows VST3

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022   # Fijado a VS2022 (windows-latest ya no lo garantiza)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar (Release)
        run: cmake --build build --config Release --parallel

      - name: Buscar el VST3 generado
        run: Get-ChildItem -Path build -Recurse -Filter *.vst3

      - name: Subir el VST3 como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TapeDelayEQ-VST3-Windows
          path: build/**/*.vst3
          if-no-files-found: warn
